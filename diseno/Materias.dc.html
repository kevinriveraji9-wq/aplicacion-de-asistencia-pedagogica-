<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Quicksand','Trebuchet MS',sans-serif;color:#33302B}
    a{color:#2F6FB3}
    a:hover{color:#22527F}
    .ic{stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</helmet>

<div style="width:1440px;height:900px;background:#F7F4EE;display:flex;flex-direction:column">

  <div style="height:88px;flex-shrink:0;background:#fff;border-bottom:3px solid #E4DED3;display:flex;align-items:center;gap:14px;padding:0 36px">
    <div style="display:flex;align-items:center;gap:10px;height:60px;padding:0 24px;border-radius:16px;border:3px solid #E4DED3;font-size:21px;font-weight:700">
      <svg viewBox="0 0 24 24" width="24" height="24" class="ic"><path d="M15 5l-7 7 7 7"/></svg>
      Atrás
    </div>
    <div style="display:flex;align-items:center;gap:10px;height:60px;padding:0 24px;border-radius:16px;border:3px solid #E4DED3;font-size:21px;font-weight:700">
      <svg viewBox="0 0 24 24" width="24" height="24" class="ic"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.6V20h13V9.6"/></svg>
      Inicio
    </div>
    <div style="width:3px;height:46px;background:#E4DED3;margin:0 10px"></div>
    <div style="font-size:28px;font-weight:700">Kínder 2</div>
    <div style="flex:1"></div>
    <div style="font-size:20px;font-weight:600;color:#78736B">4 a 5 años</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding-top:46px">
    <div style="font-size:46px;font-weight:700;margin-bottom:40px">¿Qué materia?</div>

    <div style="display:flex;gap:36px;margin-bottom:36px">

      <div style="width:340px;height:234px;background:#FAEEEC;border:3px solid #D2544A;border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="width:64px;height:64px;border-radius:18px;background:#D2544A;color:#fff;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="32" height="32" class="ic"><rect x="3" y="4" width="18" height="13" rx="3.5"/><path d="M8.5 17L7 21.5l5.5-4.5"/></svg>
        </div>
        <div>
          <div style="font-size:29px;font-weight:700;color:#A63C34">Lenguaje</div>
          <div style="font-size:20px;font-weight:600;color:#78736B;margin-top:5px">7 temas</div>
        </div>
      </div>

      <div style="width:340px;height:234px;background:#EAF1F9;border:3px solid #2F6FB3;border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="width:64px;height:64px;border-radius:18px;background:#2F6FB3;color:#fff;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="32" height="32" class="ic"><path d="M3.5 7h6M6.5 4v6"/><path d="M14.5 7h6"/><path d="M4 15.5l5 5M9 15.5l-5 5"/><path d="M14.5 16h6M14.5 20h6"/></svg>
        </div>
        <div>
          <div style="font-size:29px;font-weight:700;color:#22527F">Matemáticas</div>
          <div style="font-size:20px;font-weight:600;color:#78736B;margin-top:5px">6 temas</div>
        </div>
      </div>

      <div style="width:340px;height:234px;background:#EAF3ED;border:3px solid #3E8E5A;border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="width:64px;height:64px;border-radius:18px;background:#3E8E5A;color:#fff;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="32" height="32" class="ic"><path d="M5 19.5C5 11.5 11 5 19.5 4.5 20 13 13.5 19.5 5 19.5z"/><path d="M9 15.5l7.5-7.5"/></svg>
        </div>
        <div>
          <div style="font-size:29px;font-weight:700;color:#2E6B43">Exploración del medio</div>
          <div style="font-size:20px;font-weight:600;color:#78736B;margin-top:5px">8 temas</div>
        </div>
      </div>

    </div>

    <div style="display:flex;gap:36px">

      <div style="width:340px;height:234px;background:#F1ECF7;border:3px solid #7B5EA7;border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="width:64px;height:64px;border-radius:18px;background:#7B5EA7;color:#fff;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="32" height="32" class="ic"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.3" cy="9.3" r="2.6"/><path d="M16 14.6c2.8.3 5 2.7 5 5.4"/></svg>
        </div>
        <div>
          <div style="font-size:29px;font-weight:700;color:#5D4482">Convivencia y emociones</div>
          <div style="font-size:20px;font-weight:600;color:#78736B;margin-top:5px">5 temas</div>
        </div>
      </div>

      <div style="width:340px;height:234px;background:#F9F0E1;border:3px solid #C98A2E;border-radius:28px;padding:26px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="width:64px;height:64px;border-radius:18px;background:#C98A2E;color:#fff;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="32" height="32" class="ic"><circle cx="6.5" cy="17.5" r="3"/><circle cx="17.5" cy="15.5" r="3"/><path d="M9.5 17.5V6l11-2v11.5"/></svg>
        </div>
        <div>
          <div style="font-size:29px;font-weight:700;color:#96661D">Arte y música</div>
          <div style="font-size:20px;font-weight:600;color:#78736B;margin-top:5px">6 temas</div>
        </div>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
