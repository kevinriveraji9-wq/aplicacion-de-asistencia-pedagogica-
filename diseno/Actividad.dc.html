<!doctype html>
<html>
<head>

<x-dc>
<helmet>

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Quicksand','Trebuchet MS',sans-serif;color:#33302B}
    a{color:#2F6FB3}
    a:hover{color:#22527F}
    .ic{stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lbl{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#2F6FB3}
  </style>
</helmet>

<div style="width:1440px;height:900px;background:#F7F4EE;display:flex;flex-direction:column">

  <div style="height:88px;flex-shrink:0;background:#fff;border-bottom:3px solid #E4DED3;display:flex;align-items:center;gap:14px;padding:0 36px">
    <div style="display:flex;align-items:center;gap:10px;height:60px;padding:0 24px;border-radius:16px;border:3px solid #E4DED3;font-size:21px;font-weight:700">
      <svg viewBox="0 0 24 24" width="24" height="24" class="ic"><path d="M15 5l-7 7 7 7"/></svg>
      Atrás
    </div>
    <div style="display:flex;align-items:center;gap:10px;height:60px;padding:0 24px;border-radius:16px;border:3px solid #E4DED3;font-size:21px;font-weight:700">
      <svg viewBox="0 0 24 24" width="24" height="24" class="ic"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.6V20h13V9.6"/></svg>

    <div style="width:3px;height:46px;background:#E4DED3;margin:0 8px"></div>

      <svg viewBox="0 0 24 24" width="28" height="28" class="ic"><rect x="2.5" y="4" width="19" height="13.5" rx="2.5"/><path d="M8.5 21h7M12 17.5V21"/></svg>

    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:700;background:#2F6FB3;color:#fff;border-right:3px solid #E4DED3">
      <svg viewBox="0 0 24 24" width="28" height="28" class="ic"><circle cx="8" cy="8" r="4.6"/><rect x="13" y="13" width="8.5" height="8.5" rx="2.2"/></svg>

    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:700;color:#78736B">

      <div style="width:104px;height:104px;border-radius:50%;background:#2F6FB3;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg viewBox="0 0 24 24" width="52" height="52" class="ic" style="stroke-width:2.2"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z"/><path d="M16.5 9.5c1.4 1.4 1.4 3.6 0 5"/><path d="M19 7c2.7 2.7 2.7 7.3 0 10"/></svg>
      </div>
    </div>

    <div style="width:1160px;height:224px;background:#fff;border:3px solid #E4DED3;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:44px;margin-bottom:26px">
      <svg viewBox="0 0 60 100" width="70" height="117"><ellipse cx="30" cy="34" rx="24" ry="30" fill="#D2544A"/><path d="M30 64l-5.5 8h11z" fill="#A63C34"/><path d="M30 72c0 10 8 12 8 21" stroke="#C6C0B5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 60 100" width="70" height="117"><ellipse cx="30" cy="34" rx="24" ry="30" fill="#2F6FB3"/><path d="M30 64l-5.5 8h11z" fill="#22527F"/><path d="M30 72c0 10-8 12-8 21" stroke="#C6C0B5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 60 100" width="70" height="117"><ellipse cx="30" cy="34" rx="24" ry="30" fill="#C98A2E"/><path d="M30 64l-5.5 8h11z" fill="#96661D"/><path d="M30 72c0 10 8 12 8 21" stroke="#C6C0B5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 60 100" width="70" height="117"><ellipse cx="30" cy="34" rx="24" ry="30" fill="#3E8E5A"/><path d="M30 64l-5.5 8h11z" fill="#2E6B43"/><path d="M30 72c0 10-8 12-8 21" stroke="#C6C0B5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 60 100" width="70" height="117"><ellipse cx="30" cy="34" rx="24" ry="30" fill="#7B5EA7"/><path d="M30 64l-5.5 8h11z" fill="#5D4482"/><path d="M30 72c0 10 8 12 8 21" stroke="#C6C0B5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 60 100" width="70" height="117"><ellipse cx="30" cy="34" rx="24" ry="30" fill="#D2544A"/><path d="M30 64l-5.5 8h11z" fill="#A63C34"/><path d="M30 72c0 10-8 12-8 21" stroke="#C6C0B5" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    </div>

    <div style="display:flex;gap:48px">

      <div style="width:186px;height:186px;border-radius:32px;background:#fff;border:4px solid #D8D2C7;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;color:#33302B">5</div>

      <div style="width:186px;height:186px;border-radius:32px;background:#EAF3ED;border:7px solid #3E8E5A;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;color:#2E6B43;position:relative">
        6
        <div style="position:absolute;top:-18px;right:-18px;width:60px;height:60px;border-radius:50%;background:#3E8E5A;color:#fff;display:flex;align-items:center;justify-content:center;border:4px solid #F7F4EE">
          <svg viewBox="0 0 24 24" width="30" height="30" class="ic" style="stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
        </div>
      </div>

      <div style="width:186px;height:186px;border-radius:32px;background:#fff;border:4px solid #D8D2C7;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:700;color:#33302B">7</div>

    </div>

  </div>

  <div style="height:76px;flex-shrink:0;background:#fff;border-top:3px solid #E4DED3;display:flex;align-items:center;padding:0 36px;gap:18px">
    <div style="font-size:19px;font-weight:700;color:#78736B">Actividad 1 de 3</div>
    <div style="font-size:19px;font-weight:600;color:#C6C0B5">·</div>
    <div style="font-size:19px;font-weight:600;color:#A9A399">Contar y elegir el número</div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:14px;border:3px solid #E4DED3;font-size:19px;font-weight:700;color:#4A463F">
      Repetir
    </div>
    <div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:14px;background:#2F6FB3;color:#fff;font-size:19px;font-weight:700">
      Siguiente actividad
      <svg viewBox="0 0 24 24" width="21" height="21" class="ic"><path d="M9 5l7 7-7 7"/></svg>
    </div>

</div>
